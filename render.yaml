# Render Blueprint: hosts this repo as a free static site.
# In Render: New > Blueprint, pick this repo, then Apply.
services:
  - type: web
    name: nexraven-site
    runtime: static
    # Plain HTML site: nothing to build, Render publishes the repo root as is.
    buildCommand: echo "No build step"
    staticPublishPath: .
    headers:
      # Screens and logos rarely change: let browsers cache them for a week.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      # Always fetch the latest page so edits show up straight away.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
